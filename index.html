		 <script>
			const ShopBox = document.querySelector('#rss');
			let saved_Items;
			async function LoadJson()
			{
				let response = await fetch('oshirase.json');
				saved_Items = await response.json();
				Load_View(saved_Items);
				scrollToHash();
			}
			function Load_View(items)
			{
				ShopBox.innerHTML = '';
				Object.keys(items).sort((a, b) => b.localeCompare(a)).forEach(key => {
					const item = items[key];
					const btn = document.createElement('li');
					btn.innerHTML = `
					<a>${item.title}</a>
					`;
					ShopBox.appendChild(btn);
				});
			}
			LoadJson();
		</script>
