<!DOCTYPE html>
<html lang="ja">
	<head>
<meta property="og:site_name" content="趣味プログラマー人間">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<link rel="stylesheet" href="/style.css">
		<script defer type="module" type="module"	src="/tool/script.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.2/decimal.min.js"></script>
		<title>単位変換</title>
	</head>
		<body id="body">
		<nav><div class="nav_style"><details><summary></summary><div class="nav_style_in"><div id="nav_div"></div>
		<h4>
			目次
		</h4>
		<ul>
			<li>
				<a href="#long">
					長さ
				</a>
			</li>
		</ul>
		</details><div id="nav_share_div"></div></div></nav>
		<div onclick="sites()" class="sites">
		<header>
			<div id="hedaer_div"></div>
			<div id="hedaer_div_two">
				<img alt="logo" src="./img/cpu.avif">
				<h2>
					スペック測定
				</h2>
			</div>
		</header>
		<main>
			<p>
				複雑な処理を終える秒数で、スペックを測定します
			</p>
			<button onclick="start()">
				測定開始
			</button><br>
			<progress style="width: 50%;height: 50px;" id="load" value="0"max="1250"></progress>
			<p>
				あなたの機器は、<span id="sct" style="font-size: 50px;">0</span>ミリ秒で処理を終えました
			</p>
			<details>
				<summary>
					参考記録
				</summary>
				<ul>
					<li>
						CPU:intel Core i7-13700F
					</li>
					<li>
						RAM:16GB
					</li>
					<li>
						GPU:NVIDIA GeForace RTX 4060
					</li>
				</ul>
				のPCで、24087ミリ秒でした。
			</details>
		</main>
		<script>
			const html_id_load=document.getElementById("load");
			const html_id_sct=document.getElementById("sct");
			let i=0;
			let a=0;
			let starttime;
			let time=0;
			function start()
			{
				i=0;
				a=0;
				starttime = performance.now();
				run();
			}
			function run()
			{
				on();
				i++;
				html_id_load.value=i;
				if(i<1250)
				{
					setTimeout(run,0)
				}
				else
				{
					const endtime=performance.now();
					time= endtime-starttime;
					html_id_sct.innerText=Math.round(time);
					console.log(time);
				}
			}
			function on()
			{
				let a=0;
				for(let i=0;i<1000000;i++)
				{
					a +=Math.sqrt(Math.sqrt(i*Math.random())*
						Math.sqrt(i*Math.random())*
						Math.sqrt(i*Math.random())*
						Math.sqrt(i*Math.random())*
						Math.sqrt(i*Math.random())*Math.random());
				}
				return a;
			}
		</script>
	</body>
</html>
