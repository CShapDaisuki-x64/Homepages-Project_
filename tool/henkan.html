<!DOCTYPE html>
<html lang="ja">
	<head>
<meta property="og:site_name" content="趣味プログラマー人間">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<link rel="stylesheet" href="/style.css">
		<script defer type="module" type="module"	src="/tool/script.js"></script>

		<title>趣味プログラマー人間-Tool-単位変換</title>
	</head>
		<body id="body">
		<nav><div class="nav_style"><details><summary></summary><div class="nav_style_in"><div id="nav_div"></div>

			目次
		</h4>

			<li>

		<div onclick="sites()" class="sites">
		<header>
			<div id="hedaer_div"></div>
			<div id="hedaer_div_two">
				<img alt="logo" src="./img/henkan.avif">
				<h2>
					単位変換
				</h2>
			</div>
		</header>
		<main>
			<p>
				使用上、ある程度の誤差が出る可能性があります。信頼性が必要な場面では使用しないでください
			</p>
			<h3 id="long">
				長さ
			</h3>
			<label>変換前</label>
			<input id="long_number" type="number">
			<select id="long_from">
				<option value="mm">mm</option>
				<option value="cm">cm</option>
				<option value="dm">dm</option>
				<option value="m">m</option>
				<option value="dam">dam</option>
				<option value="hm">hm</option>
				<option value="km">km</option>
				<option value="in">in</option>
				<option value="ft">ft</option>
				<option value="yd">yd</option>
				<option value="mi">mi</option>
				<option value="nmi">nmi</option>
				<option value="分">分</option>
				<option value="寸">寸</option>
				<option value="尺">尺</option>
				<option value="間">間</option>
				<option value="町">町</option>
				<option value="里">里</option>
			</select><br>
			<label>
				変換後
			</label>
			<select id="long_to">
				<option value="mm">mm</option>
				<option value="cm">cm</option>
				<option value="dm">dm</option>
				<option value="m">m</option>
				<option value="dam">dam</option>
				<option value="hm">hm</option>
				<option value="km">km</option>
				<option value="in">in</option>
				<option value="ft">ft</option>
				<option value="yd">yd</option>
				<option value="mi">mi</option>
				<option value="nmi">nmi</option>
				<option value="分">分</option>
				<option value="寸">寸</option>
				<option value="尺">尺</option>
				<option value="間">間</option>
				<option value="町">町</option>
				<option value="里">里</option>
			</select><br>
			<button onclick="long_ivent('long_to','long_from','long_number','long_out')">
				変換
			</button>
			<button onclick="copy('long_out')">
				コピー
			</button>
			<p id="long_out">　</p>
			<hr>
			<h3 id="g">
				重さ
			</h3>
			<label>変換前</label>
			<input id="g_number" type="number">
			<select id="g_from">
				<option value="mg">mg</option>
				<option value="cg">cg</option>
				<option value="dg">dg</option>
				<option value="g">g</option>
				<option value="dag">dag</option>
				<option value="hg">hg</option>
				<option value="kg">kg</option>
				<option value="t">t</option>
				<option value="gr">gr</option>
				<option value="dr">dr</option>
				<option value="oz">oz</option>
				<option value="lb">lb</option>
				<option value="st">st</option>
				<option value="cwt">cwt</option>
				<option value="t_us">米t</option>
				<option value="t_uk">英t</option>
				<option value="貫">貫</option>
				<option value="斤">斤</option>
				<option value="両">両</option>
				<option value="匁">匁</option>
			</select><br>
			<label>
				変換後
			</label>
			<select id="g_to">
				<option value="mg">mg</option>
				<option value="cg">cg</option>
				<option value="dg">dg</option>
				<option value="g">g</option>
				<option value="dag">dag</option>
				<option value="hg">hg</option>
				<option value="kg">kg</option>
				<option value="t">t</option>
				<option value="gr">gr</option>
				<option value="dr">dr</option>
				<option value="oz">oz</option>
				<option value="lb">lb</option>
				<option value="st">st</option>
				<option value="cwt">cwt</option>
				<option value="t_us">米t</option>
				<option value="t_uk">英t</option>
				<option value="貫">貫</option>
				<option value="斤">斤</option>
				<option value="両">両</option>
				<option value="匁">匁</option>
			</select><br>
			<button onclick="long_ivent('g_to','g_from','g_number','g_out')">
				変換
			</button>
			<button onclick="copy('g_out')">
				コピー
			</button><br>
			<p id="g_out">　</p>
		</main>
		<footer><div id="footer_div" ></div></footer>
		<script>
			const long_units = {
				"mm": new Decimal("0.001"),
				"cm": new Decimal("0.01"),
				"dm": new Decimal("0.1"),
				"m": new Decimal("1"),
				"dam": new Decimal("10"),
				"hm": new Decimal("100"),
				"km": new Decimal("1000"),
				"in": new Decimal("0.0254"),
				"ft": new Decimal("0.3048"),
				"yd": new Decimal("0.9144"),
				"mi": new Decimal("1609.344"),
				"nmi": new Decimal("1852"),
				"分": new Decimal(1).div(330),
				"寸": new Decimal(1).div(33),
				"尺": new Decimal(10).div(33),
				"間": new Decimal(20).div(11),
				"町": new Decimal(600).div(11),
				"里": new Decimal(21600).div(11),

				"mg":new Decimal("0.001"),
				"cg": new Decimal("0.01"),
				"dg": new Decimal("0.1"),
				"g": new Decimal("1"),
				"dag": new Decimal("10"),
				"hg": new Decimal("100"),
				"kg": new Decimal("1000"),
				"t": new Decimal("1000000"),
				"gr": new Decimal("0.06479891"),
				"dr": new Decimal("1.7718451953125"),
				"oz": new Decimal("28.349523125"),
				"lb": new Decimal("453.59237"),
				"st": new Decimal("6350.29318"),
				"cwt": new Decimal("45359.237"),
				"t_us": new Decimal("907184.74"),
				"t_uk": new Decimal("1016046.9088"),
				"貫": new Decimal("3750"),
				"斤": new Decimal("600"),
				"両": new Decimal("37.5"),
				"匁": new Decimal("3.75"),
			};
			function long_ivent(fito,fiform,fitype,outype)
			{
				if(document.getElementById(fitype).value==="")
				{
					return;
				}
				else
				{
					const value = new Decimal(document.getElementById(fitype).value);
					document.getElementById(outype).innerText = from(document.getElementById(fiform).value,value,document.getElementById(fito).value);
				}
			}
			function from(type, value, totype)
			{
				const meter = value.mul(long_units[type]);
				return meter.div(long_units[totype]).toFixed().toString() + totype;
			}
			function copy(wath)
			{
				navigator.clipboard.writeText(document.getElementById(wath).innerText);
			}
		</script>
	</body>
</html>
