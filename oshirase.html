<!DOCTYPE html>
<html lang="ja">
	<head>
		<link rel="alternate" type="application/rss+xml" title="趣味プログラマー人間のホームページ" href="https://syumi-programmer-ningen.pages.dev/now_rss.xml">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<link rel="stylesheet" href="style.css">
		<script defer type="module" type="module"	src="script.min.js" ></script>
		<title>趣味プログラマー人間-お知らせ</title>
	</head>
	<body id="body">
		<header>
			<div id="hedaer_div"></div>
			<div id="hedaer_div_two">
				<img src="img/oshirase.html.avif">
				<h2>
					お知らせ
				</h2>
			</div>
		</header>
		<main>
			<button onclick="window.location='oshirase.json'">
				元ファイル
			</button>
			<button onclick="window.location='now_rss.xml'">
				<img src="rss.svg"> RSS
			</button>
			<div class="tanaka"></div>
		</main>
		<footer>
			<div id="footer_div"></div>
		</footer>
				<script>
			const ShopBox = document.querySelector('.tanaka');
			let saved_Items;
			async function LoadJson()
			{
				let response = await fetch('oshirase.json');
				saved_Items = await response.json();
				Load_View(saved_Items);
				scrollToHash();
			}
			function Load_View(items)
			{
				ShopBox.innerHTML = '';
				Object.keys(items).sort((a, b) => b.localeCompare(a)).forEach(key => {
					const item = items[key];
					const btn = document.createElement('div');
					btn.className = "koumoku";
					btn.id = key;
					let cdn1 = key.match(/.{4}/g);
					let cdn2 = cdn1[1].match(/.{2}/g);
					let cdn3=`${cdn1[0]}/${cdn2[0]}/${cdn2[1]}`;
					console.log(cdn3)
					btn.innerHTML = `
					<h3>${item.title}</h3>
					<div class="day">
						${cdn3}
					</div>
					<p style="white-space: pre-line;">${item.content}</p>
					`;
					if(item.link_type=="insite")
					{
						btn.innerHTML=btn.innerHTML+`
						<button onclick="window.location.href = '/${item.link}';">
							リンクを開く
						</button>
						`;
					}
					else if(item.link_type=="outsite")
					{
						btn.innerHTML=btn.innerHTML+`
						<button onclick="window.location.href = '${item.link}';">
							リンクを開く
						</button>
						`;
					}

					ShopBox.appendChild(btn);
				});
			}
			function scrollToHash() {
				const hash = window.location.hash;
				if (hash) {
				const targetElement = document.getElementById(hash.substring(1));
					if (targetElement) {
						targetElement.scrollIntoView({ behavior: 'auto', block: 'start' });
					}
				}
			}
			window.addEventListener('hashchange', scrollToHash);
			LoadJson();
		</script>
	</body>
</html>
