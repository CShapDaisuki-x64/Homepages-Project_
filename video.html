<!DOCTYPE html>
<html lang="ja">
	<head>
<meta property="og:site_name" content="趣味プログラマー人間">
		<link rel="alternate" type="application/rss+xml" title="趣味プログラマー人間のホームページ" href="https://syumi-programmer-ningen.pages.dev/now_rss.xml">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<link rel="stylesheet" href="style.css">
		<script defer type="module" type="module"	src="script.js" ></script>
		<title>趣味プログラマー人間-動画ID検索</title>
	</head>
		<body id="body">
<nav><div class="nav_style"><details><summary></summary><div class="nav_style_in"><div id="nav_div"></div></details><div id="nav_share_div"></div></div></nav>
		<div onclick="sites()" class="sites">
		<header>
			<div id="hedaer_div"></div>
			<div id="hedaer_div_two">
				<img src="img/video.html.avif">
				<h2>
					動画ID検索
				</h2>
			</div>
		</header>
		<main>
			<p>
				※IDは完全一致させてください
			</p>
			<button onclick="window.location='video.json'">
				元ファイル
			</button>
			<form>
				<label>
					<img class="svg_nocolor_no" style="width: 1em;height: 1em;" src="/img/seartch.svg" alt="検索マーク">ここにIDを入力
				</label>
				<input type="search" id="ID">
				<input type="button" value="検索" onclick="window.location.href = 'video.html#' + document.getElementById('ID').value;">
			</form>
			<div class="Videos"></div>
		</main>
		<footer>
			<div id="footer_div"></div>
		</footer>
		</div>
		<script>
			const ShopBox = document.querySelector('.Videos');
			let saved_Items;
			async function LoadJson()
			{
				let response = await fetch('video.json');
				saved_Items = await response.json();
				Load_View(saved_Items);
				scrollToHash();
			}
			function Load_View(items)
			{
				ShopBox.innerHTML = '';
				Object.keys(items).sort((a, b) => items[b].day.localeCompare(items[a].day)).forEach(key => {
					const item = items[key];
					const btn = document.createElement('article');
					btn.className = "koumoku";
					btn.id = key;
					let cdn1 = item.day.match(/.{4}/g);
					let cdn2 = cdn1[1].match(/.{2}/g);
					let cdn3=`${cdn1[0]}/${cdn2[0]}/${cdn2[1]}`;
					console.log(cdn3)
					btn.innerHTML = `
					<h3>${item.title}</h3>
					<div class="day">
						${cdn3}
					</div>
					<p>ID:${key}</p>`;
					if(item.topic?.VoiceBig)
					{
						btn.innerHTML+=`
						<div class="info info_exp">
						<div class="info_head"></div>
							騒音
						</div>
						`;
					}
					if(item.topic?.remake)
					{
						btn.innerHTML+=`
						<div class="info info_info">
						<div class="info_head"></div>
							リメイク<br>
							<button onclick="window.location.href='#${item.topic.remake}'">
								元動画に飛ぶ
							</button>
						</div>
						`;
					}
					if(item.topic?.all)
					{
						let all_tmp=document.createElement("div");
						all_tmp.className="info info_info";
						all_tmp.innerHTML="<div class='info_head'></div>総集編"
							console.log(item.topic.all.length);
						for(let i=0;i<item.topic.all.length;i++)
						{
							console.log(i)
							let all_tmp_tow=document.createElement("a");
							all_tmp_tow.innerText+=item.topic.all[i];
							all_tmp_tow.href=`#${item.topic.all[i]}`;
							all_tmp.appendChild(document.createElement("br"));
							all_tmp.appendChild(all_tmp_tow);
						}
						btn.appendChild(all_tmp);
					}
					if(item.nicovideo)
					{
						btn.innerHTML+=`
							<button onclick="window.open('https://nicovideo.jp/watch/${item.nicovideo}')">
								ニコニコ動画で見る
							</button>
						`;
					}
					if(item.youtube)
					{
						btn.innerHTML+=`
							<button onclick="window.open('https://youtu.be/${item.youtube}')">
								Youtubeで見る
							</button>
						`;
					}
					ShopBox.appendChild(btn);
				});
			}
			function scrollToHash() {
				const hash = window.location.hash;
				if (hash) {
				const targetElement = document.getElementById(hash.substring(1));
					if (targetElement) {
						targetElement.scrollIntoView({ behavior: 'auto', block: 'start' });
					}
				}
			}
			document.getElementById("ID").addEventListener("keydown", test_event);
			function test_event(e) {
				if (e.key === "Enter") {
					e.preventDefault();
					window.location.href = 'video.html#' + document.getElementById('ID').value;
				}
				return false;
			}
			window.addEventListener('hashchange', scrollToHash);
			LoadJson();
		</script>
	</body>
</html>
